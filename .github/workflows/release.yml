# Pushing a tag like v1.0.0 builds the Docker image and pushes it to
# ghcr.io/tim80732/itinerary-builder (:1.0.0 and :latest), and makes a release page.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  packages: write # push the image

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tim80732/itinerary-builder:${{ env.VERSION }}
            ghcr.io/tim80732/itinerary-builder:latest
          labels: |
            org.opencontainers.image.source=https://github.com/tim80732/itinerary-builder
            org.opencontainers.image.description=Builds travel itineraries card by card and exports each as one self-contained offline HTML file. Built with AI (Claude).
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.VERSION }}

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
